# Builds a debug APK of the Firestore-mode app and uploads it as a
# downloadable artifact. No emulator, no signing (debug key only).
name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [phase-1-firestore]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APPS_SCRIPT_URL: https://script.google.com/macros/s/AKfycby0H6Sk-V1mCGJNtst4KzvraWplYqMn6exWDlLCybiINoGlXnSCUNdkNaJ8D4o0tC3u/exec
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - run: flutter pub get

      - name: Build debug APK (Firestore mode)
        run: >
          flutter build apk --debug
          --dart-define=DATA_SOURCE=firestore
          --dart-define=APPS_SCRIPT_URL=$APPS_SCRIPT_URL

      - uses: actions/upload-artifact@v4
        with:
          name: pcu-connect-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
