<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My guests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Rubik',system-ui,sans-serif}
a{text-decoration:none;color:inherit}
button{font-family:inherit}
input{font-family:inherit}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#F3F4F7;color:#14213A;display:flex;flex-direction:column">

<div style="background:#0B1F3A;padding:28px 20px 20px;display:flex;flex-direction:column;gap:12px;border-radius:0 0 32px 32px">
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
<div>
<div style="color:#fff;font-size:28px;font-weight:600">My guests</div>
<div style="color:#B9C4D8;font-size:14px;margin-top:2px">{{monthLabel}}</div>
</div>
<button onClick="{{toggle}}" aria-label="Choose month" style="width:46px;height:46px;border-radius:14px;border:none;background:#E3B341;display:flex;align-items:center;justify-content:center;flex:none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
</button>
</div>
<div style="display:flex;align-items:center;gap:10px;background:#14305A;border-radius:14px;padding:0 14px;height:46px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9C4D8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<label for="q" style="position:absolute;left:-9999px">Search guests</label>
<input id="q" placeholder="Search name or phone" style="flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:15px">
</div>
</div>

<div style="padding:14px 16px 0;display:flex;gap:8px;overflow:hidden">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button onClick="{{c.pick}}" style="flex:none;height:40px;padding:0 14px;border-radius:999px;border:{{c.border}};background:{{c.bg}};color:{{c.fg}};font-size:13px;font-weight:600">{{c.label}} · {{c.n}}</button>
</sc-for>
</div>

<div style="padding:12px 16px 0;display:flex;flex-direction:column;gap:8px;flex-grow:1;min-height:0;overflow:hidden">
<sc-for list="{{rows}}" as="g" hint-placeholder-count="6">
<a href="Guest.dc.html" style="background:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(11,31,58,0.08)">
<div style="width:42px;height:42px;border-radius:50%;background:#E6EBF4;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none">{{g.initial}}</div>
<div style="flex-grow:1;min-width:0">
<div style="font-size:15px;font-weight:600">{{g.name}}</div>
<div style="font-size:13px;color:#5B6678">{{g.meta}}</div>
</div>
<span style="background:{{g.bg}};color:{{g.fg}};border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap">{{g.status}}</span>
</a>
</sc-for>
</div>

<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<div style="position:absolute;right:16px;top:100px;width:200px;background:#fff;border-radius:18px;padding:8px;box-shadow:0 14px 40px rgba(11,31,58,0.28);z-index:5;display:flex;flex-direction:column;gap:2px">
<sc-for list="{{monthOptions}}" as="m" hint-placeholder-count="6">
<button onClick="{{m.pick}}" style="text-align:left;font-family:inherit;border:none;background:{{m.bg}};color:{{m.fg}};border-radius:12px;padding:11px 12px;font-size:14px;font-weight:{{m.weight}}">{{m.label}}</button>
</sc-for>
</div>
</sc-if>

<div style="height:72px;flex:none;background:#fff;border-top:1px solid #E3E6EC;display:flex">
<sc-for list="{{nav}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:{{t.color}};font-size:12px;font-weight:{{t.weight}}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"/></svg>{{t.label}}
<span style="width:20px;height:3px;border-radius:2px;background:{{t.bar}}"></span>
</a>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { f: 'all', m: 'All', open: false };
  renderVals() {
    const R = { bg: '#FBE5E3', fg: '#B3261E' }, A = { bg: '#FFF1D6', fg: '#8A5300' }, G = { bg: '#E4F4EA', fg: '#1B7A46' }, Y = { bg: '#FFF3CC', fg: '#7A5A00' }, N = { bg: '#E6EBF4', fg: '#0B1F3A' };
    const mk = (name, meta, status, c, tags) => ({ initial: name[0], name, meta, status, bg: c.bg, fg: c.fg, tags });
    const full = [
      mk('Chinedu Eze', 'Oct · assigned today', 'New', N, ['call']),
      mk('Adaeze Okafor', 'Oct · 4 days ago', 'Overdue', R, ['call']),
      mk('Tunde Bakare', 'Oct · 2 days ago', 'Not called', A, ['call']),
      mk('Funke Adeyemi', 'Oct · 4 follow-ups · Evangelism', 'Followed up', G, ['fu', 'team']),
      mk('Kemi Salau', 'Oct · 2 follow-ups', 'Followed up', G, ['fu']),
      mk('Emeka Obi', 'Sep · 3 Sundays, 2 Wednesdays · Workforce', 'Member', Y, ['mem', 'team']),
      mk('Ngozi Ibe', 'Sep · 1 follow-up', 'Called once', A, ['fu']),
      mk('Seun Ajayi', 'Aug · 7 follow-ups', 'Followed up', G, ['fu'])
    ];
    const mSel = this.state.m;
    const all = full.map(g => ({ ...g, month: g.meta.split(' ·')[0] })).filter(g => mSel === 'All' || g.month === mSel);
    const monthNames = ['All', 'Oct', 'Sep', 'Aug', 'Jul', 'Jun', 'May'];
    const defs = [['all', 'All'], ['call', 'To call'], ['fu', 'Followed up'], ['mem', 'Members'], ['team', 'In a team']];
    const cnt = (k) => k === 'all' ? all.length : all.filter(g => g.tags.includes(k)).length;
    const f = this.state.f;
    const tabs = [
      ['Main.dc.html', 'Today', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM8 12l3 3 5-6'],
      ['MyGuests.dc.html', 'Guests', 'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01'],
      ['Leaderboard.dc.html', 'Ranking', 'M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H4v1a3 3 0 0 0 4 2.8M16 6h4v1a3 3 0 0 1-4 2.8M12 13v4M8 20h8M10 17h4'],
      ['Me.dc.html', 'Me', 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0']
    ];
    return {
      nav: tabs.map((t, i) => ({ href: t[0], label: t[1], d: t[2], color: i === 1 ? '#0B1F3A' : '#5B6678', weight: i === 1 ? 600 : 500, bar: i === 1 ? '#E3B341' : 'transparent' })),
      open: this.state.open,
      toggle: () => this.setState({ open: !this.state.open }),
      monthLabel: mSel === 'All' ? 'Every guest given to you, all months' : mSel + ' 2026 guests',
      monthOptions: monthNames.map((n) => ({ label: n === 'All' ? 'All months' : n + ' 2026', pick: () => this.setState({ m: n, open: false }), bg: mSel === n ? '#FFF3CC' : '#fff', fg: '#14213A', weight: mSel === n ? 600 : 400 })),
      chips: defs.map(([k, label]) => ({ label, n: cnt(k), pick: () => this.setState({ f: k }), bg: f === k ? '#0B1F3A' : '#fff', fg: f === k ? '#fff' : '#3A455A', border: f === k ? '1.5px solid #0B1F3A' : '1.5px solid #E3E6EC' })),
      rows: all.filter(g => f === 'all' || g.tags.includes(f))
    };
  }
}
</script>
</body>
</html>
