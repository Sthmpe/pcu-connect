  <style>
    html, body { margin: 0; height: 100%; background: #0B1F3A; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      background: #0B1F3A; transition: opacity 240ms ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash svg { width: 88px; height: 88px; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.35)); }
    #splash .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2.5px solid rgba(227, 179, 65, 0.25); border-top-color: #E3B341;
      animation: pcu-spin 0.9s linear infinite;
    }
    @keyframes pcu-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .spinner { animation-duration: 2.4s; } }
  </style>
</head>
<body>

  <script>
    // Dart's main() waits for this before Firebase.initializeApp, so the SDK
    // below is used instead of FlutterFire loading it from www.gstatic.com.
    window.pcuFirebaseReady = new Promise(function (resolve, reject) {
      window.__pcuFirebaseDone = resolve;
      window.__pcuFirebaseFailed = reject;
    });
    // The splash stays until Flutter has drawn its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('done');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script type="module">
    const base = new URL('firebasejs/13.1.0/', document.baseURI).href;
    try {
      // firebase-app first: the other bundles import it (see FlutterFire #18436).
      const core = await import(base + 'firebase-app.js');
      const [auth, firestore, messaging] = await Promise.all([
        import(base + 'firebase-auth.js'),
        import(base + 'firebase-firestore-pipelines.js'),
        import(base + 'firebase-messaging.js'),
      ]);
      window.firebase_core = core;
      window.firebase_auth = auth;
      window.firebase_firestore = firestore;
      window.firebase_messaging = messaging;
      window.__pcuFirebaseDone();
    } catch (e) {
      // FlutterFire then loads the SDK from its CDN as before.
      console.warn('Bundled Firebase SDK did not load', e);
      window.__pcuFirebaseFailed(e);
    }
  </script>
