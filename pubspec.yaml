name: workflow
description: "PCU Connect - Pastoral Care Unit Guest Follow-up App"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State Management (Primary)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # UI, Typography & Responsiveness
  flutter_screenutil: ^5.9.3
  # Navigation & Custom UI Utilities
  get: ^4.6.6

  # Networking & Google Auth
  http: ^1.2.2

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  lucide_icons_flutter: ^4.0.1
  cloud_firestore: ^7.1.0
  # Browser APIs for the notification sound and web push (lib/core/web).
  web: ^1.1.1
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.5.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
  # Rubik (SIL Open Font License, assets/fonts/OFL.txt), bundled so the app
  # never fetches fonts from Google at startup. Build with tool/build_web.sh.
  fonts:
    - family: Rubik
      fonts:
        # The design uses two weights (AppTextStyles); others fall back to the nearest.
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600

# Android and iOS launcher icons from the PCU logo (sources rendered by
# tool/web/render_icons.mjs). Regenerate with: dart run flutter_launcher_icons
# then run: git checkout -- ios/Runner.xcodeproj/project.pbxproj
# (version 0.14.4 rewrites that file and sets a wrong build setting; the
# project already uses the AppIcon asset).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path_android: "design/logo/launcher/pcu-logo-rounded-1024.png"
  image_path_ios: "design/logo/launcher/pcu-logo-square-1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1F3A"
  adaptive_icon_foreground: "design/logo/launcher/pcu-adaptive-foreground-1024.png"
  adaptive_icon_monochrome: "design/logo/launcher/pcu-adaptive-monochrome-1024.png"
  web:
    generate: false
