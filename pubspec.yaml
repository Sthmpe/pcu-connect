name: workflow
description: "PCU Connect - Pastoral Care Unit Guest Follow-up App"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State Management (Primary)
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # UI, Typography & Responsiveness
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  # Navigation & Custom UI Utilities
  get: ^4.6.6

  # Networking & Google Auth
  http: ^1.2.2

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  lucide_icons_flutter: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
