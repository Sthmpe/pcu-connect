name: workflow
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # UI & Responsiveness
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.8.0

  # Backend & Services
  # Firebase = source of truth (Auth + Firestore data)
  firebase_core: ^3.8.0
  # firebase_storage/firebase_app_check can be added later if we move
  # media off Supabase Storage too.
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  # Supabase = Edge Functions (Sheets intake / fair assignment) + Storage only.
  # No Postgres tables are read/written by the app itself anymore.
  supabase_flutter: ^2.8.4
  flutter_dotenv: ^5.2.1

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env

